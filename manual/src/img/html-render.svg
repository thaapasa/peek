<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="901.67" height="690.00" xmlns="http://www.w3.org/2000/svg">
<rect width="779.67" height="568.00" fill="#171717" rx="8.00" ry="8.00" filter="url(#shadow)" stroke="#515151" stroke-width="1.00" x="60.00px" y="50.00px"/>
<g font-family="monospace" font-size="14.00px" fill="#c4c4c4" clip-path="url(#terminalMask)"><rect fill="#2e436e" x="80.00px" y="575.24px" height="17.80px" width="737.50000px"/><rect fill="#fff3a3" x="763.33px" y="239.24px" height="17.80px" width="54.16667px"/>
<text x="80.00px" y="101.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#4b2e83"># Inline Formatting Sampler</tspan></text><text x="80.00px" y="118.60px" xml:space="preserve"/><text x="80.00px" y="135.40px" xml:space="preserve"><tspan xml:space="preserve">Plain prose runs along like this until something interesting happens. Then we might want</tspan></text><text x="80.00px" y="152.20px" xml:space="preserve"><tspan xml:space="preserve">to say </tspan><tspan xml:space="preserve">this is important</tspan><tspan xml:space="preserve">, or perhaps </tspan><tspan xml:space="preserve" font-style="italic">this should be read with feeling</tspan><tspan xml:space="preserve">, or even </tspan><tspan xml:space="preserve" font-style="italic">both at</tspan></text><text x="80.00px" y="169.00px" xml:space="preserve"><tspan xml:space="preserve">once</tspan><tspan xml:space="preserve"> when the situation demands.</tspan></text><text x="80.00px" y="185.80px" xml:space="preserve"/><text x="80.00px" y="202.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#2a6e3f">## Color and emphasis</tspan></text><text x="80.00px" y="219.40px" xml:space="preserve"/><text x="80.00px" y="236.20px" xml:space="preserve"><tspan xml:space="preserve">Status messages often carry color. A </tspan><tspan xml:space="preserve" fill="#1b7a3e">successful build looks different from a </tspan><tspan xml:space="preserve" fill="#b00020">failing</tspan></text><text x="80.00px" y="253.00px" xml:space="preserve"><tspan xml:space="preserve">one, and an </tspan><tspan xml:space="preserve" fill="#1f4f99">informational note sits somewhere quieter. Sometimes a phrase needs a visual</tspan></text><text x="80.00px" y="269.80px" xml:space="preserve"><tspan xml:space="preserve">highlight so it is impossible to miss when you skim. The aside in the corner says less</tspan></text><text x="80.00px" y="286.60px" xml:space="preserve"><tspan xml:space="preserve">by saying it softly.</tspan></text><text x="80.00px" y="303.40px" xml:space="preserve"/><text x="80.00px" y="320.20px" xml:space="preserve"><tspan xml:space="preserve">Inline </tspan><tspan xml:space="preserve" fill="#b03060">code spans</tspan><tspan xml:space="preserve"> sit in the middle of sentences, and so do Ctrl + K keyboard hints. A</tspan></text><text x="80.00px" y="337.00px" xml:space="preserve"><tspan xml:space="preserve">gradient headline shows up occasionally when designers feel ambitious.</tspan></text><text x="80.00px" y="353.80px" xml:space="preserve"/><text x="80.00px" y="370.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#2a6e3f">## Typography variants</tspan></text><text x="80.00px" y="387.40px" xml:space="preserve"><tspan xml:space="preserve">* Old text we no longer endorse: use the deprecated API.</tspan></text><text x="80.00px" y="404.20px" xml:space="preserve"><tspan xml:space="preserve">* A correction underlined in red: do not skip the migration.</tspan></text><text x="80.00px" y="421.00px" xml:space="preserve"><tspan xml:space="preserve">* A heading-like phrase in small capitals for emphasis.</tspan></text><text x="80.00px" y="437.80px" xml:space="preserve"><tspan xml:space="preserve">* Subscript and super^{script} for chemistry and footnotes¹.</tspan></text><text x="80.00px" y="454.60px" xml:space="preserve"><tspan xml:space="preserve">* An abbreviation: CSS with a tooltip.</tspan></text><text x="80.00px" y="471.40px" xml:space="preserve"><tspan xml:space="preserve">* A keyboard shortcut combo: Cmd+Shift+P.</tspan></text><text x="80.00px" y="488.20px" xml:space="preserve"><tspan xml:space="preserve">* A sample of program output: Segmentation fault (core dumped).</tspan></text><text x="80.00px" y="505.00px" xml:space="preserve"><tspan xml:space="preserve">* A variable name in math: x &lt; y + 3.</tspan></text><text x="80.00px" y="521.80px" xml:space="preserve"><tspan xml:space="preserve">* Marked text the editor wants to flag: this passage is under review.</tspan></text><text x="80.00px" y="538.60px" xml:space="preserve"><tspan xml:space="preserve">* An inline quotation: computers do exactly what you tell them to.</tspan></text><text x="80.00px" y="555.40px" xml:space="preserve"/><text x="80.00px" y="572.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#2a6e3f">## A blockquote</tspan></text><text x="80.00px" y="589.00px" xml:space="preserve"><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#56a8f5">formatted.html </tspan><tspan xml:space="preserve" fill="#7a7e85">│ </tspan><tspan xml:space="preserve" fill="#bcbec4">Rendered </tspan><tspan xml:space="preserve" fill="#7a7e85">│ idea-dark               h:help  Tab:cycle  t:theme  q:quit </tspan></text>
</g>
<svg x="60.00px" y="50.00px"><circle cx="13.50" cy="12.00" r="5.50" fill="#FF5A54"/><circle cx="32.50" cy="12.00" r="5.50" fill="#E6BF29"/><circle cx="51.50" cy="12.00" r="5.50" fill="#52C12B"/></svg><defs><filter id="shadow" filterUnits="userSpaceOnUse"><feGaussianBlur in="SourceAlpha" stdDeviation="24.00"/><feOffset result="offsetblur" dx="0.00" dy="12.00"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>
