<text x="20.00px" y="36.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Release Notes — Acme Toolkit </tspan><tspan xml:space="preserve" fill="#bcbec4">v3.7.0</tspan></text><text x="20.00px" y="53.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">════════════════════════════════════════════════════════════════════════════════════════</tspan></text><text x="20.00px" y="70.40px" xml:space="preserve"/><text x="20.00px" y="87.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#7a7e85">▍ </tspan><tspan xml:space="preserve">Heads up:</tspan><tspan xml:space="preserve"> this release reshuffles a couple of CLI flags. See the </tspan><tspan xml:space="preserve" text-decoration="underline">Migration</tspan><tspan xml:space="preserve">            </tspan></text><text x="20.00px" y="104.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#7a7e85">▍ (#migration) section before upgrading production hosts.                               </tspan></text><text x="20.00px" y="120.80px" xml:space="preserve"/><text x="20.00px" y="137.60px" xml:space="preserve"><tspan xml:space="preserve">Released </tspan><tspan xml:space="preserve">2026-04-18</tspan><tspan xml:space="preserve"> · Codename </tspan><tspan xml:space="preserve" font-style="italic">&quot;Northwind&quot;</tspan><tspan xml:space="preserve"> · </tspan><tspan xml:space="preserve" text-decoration="line-through">Codename &quot;Mistral&quot; (dropped)</tspan></text><text x="20.00px" y="154.40px" xml:space="preserve"/><text x="20.00px" y="171.20px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="20.00px" y="188.00px" xml:space="preserve"/><text x="20.00px" y="204.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Highlights</tspan></text><text x="20.00px" y="221.60px" xml:space="preserve"><tspan xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="20.00px" y="238.40px" xml:space="preserve"/><text x="20.00px" y="255.20px" xml:space="preserve"><tspan xml:space="preserve">• New </tspan><tspan xml:space="preserve" fill="#bcbec4">acme scan subcommand for streaming directory audits.</tspan></text><text x="20.00px" y="272.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• 4× faster cold start on macOS (Apple Silicon).</tspan></text><text x="20.00px" y="288.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• First-class support for </tspan><tspan xml:space="preserve" fill="#bcbec4">.acmerc.toml configuration files.</tspan></text><text x="20.00px" y="305.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• Bug fixes for the long-standing </tspan><tspan xml:space="preserve" text-decoration="underline">#421</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (https://example.com/issues/421) &quot;phantom file&quot;</tspan></text><text x="20.00px" y="322.40px" xml:space="preserve"><tspan xml:space="preserve">  issue.</tspan></text><text x="20.00px" y="339.20px" xml:space="preserve"/><text x="20.00px" y="356.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Table of contents</tspan></text><text x="20.00px" y="372.80px" xml:space="preserve"><tspan xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="20.00px" y="389.60px" xml:space="preserve"/><text x="20.00px" y="406.40px" xml:space="preserve"><tspan xml:space="preserve">1. </tspan><tspan xml:space="preserve" text-decoration="underline">Highlights</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#highlights)</tspan></text><text x="20.00px" y="423.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">2. </tspan><tspan xml:space="preserve" text-decoration="underline">Installation</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#installation)</tspan></text><text x="20.00px" y="440.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">3. </tspan><tspan xml:space="preserve" text-decoration="underline">What&apos;s new</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#whats-new)</tspan></text><text x="20.00px" y="456.80px" xml:space="preserve"><tspan xml:space="preserve">   </tspan><tspan xml:space="preserve" fill="#56a8f5">• </tspan><tspan xml:space="preserve" text-decoration="underline">Streaming scans</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#streaming-scans)</tspan></text><text x="20.00px" y="473.60px" xml:space="preserve"><tspan xml:space="preserve">   </tspan><tspan xml:space="preserve" fill="#56a8f5">• </tspan><tspan xml:space="preserve" text-decoration="underline">Configuration</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#configuration)</tspan></text><text x="20.00px" y="490.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">4. </tspan><tspan xml:space="preserve" text-decoration="underline">Migration</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#migration)</tspan></text><text x="20.00px" y="507.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">5. </tspan><tspan xml:space="preserve" text-decoration="underline">Benchmarks</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#benchmarks)</tspan></text><text x="20.00px" y="524.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">6. </tspan><tspan xml:space="preserve" text-decoration="underline">Known issues</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#known-issues)</tspan></text><text x="20.00px" y="540.80px" xml:space="