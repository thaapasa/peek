<text x="80.00px" y="101.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Release Notes — Acme Toolkit </tspan><tspan xml:space="preserve" fill="#bcbec4">v3.7.0</tspan></text><text x="80.00px" y="118.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">════════════════════════════════════════════════════════════════════════════════════════</tspan></text><text x="80.00px" y="135.40px" xml:space="preserve"/><text x="80.00px" y="152.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#7a7e85">▍ </tspan><tspan xml:space="preserve">Heads up:</tspan><tspan xml:space="preserve"> this release reshuffles a couple of CLI flags. See the </tspan><tspan xml:space="preserve" text-decoration="underline">Migration</tspan><tspan xml:space="preserve">            </tspan></text><text x="80.00px" y="169.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#7a7e85">▍ (#migration) section before upgrading production hosts.                               </tspan></text><text x="80.00px" y="185.80px" xml:space="preserve"/><text x="80.00px" y="202.60px" xml:space="preserve"><tspan xml:space="preserve">Released </tspan><tspan xml:space="preserve">2026-04-18</tspan><tspan xml:space="preserve"> · Codename </tspan><tspan xml:space="preserve" font-style="italic">&quot;Northwind&quot;</tspan><tspan xml:space="preserve"> · </tspan><tspan xml:space="preserve" text-decoration="line-through">Codename &quot;Mistral&quot; (dropped)</tspan></text><text x="80.00px" y="219.40px" xml:space="preserve"/><text x="80.00px" y="236.20px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="80.00px" y="253.00px" xml:space="preserve"/><text x="80.00px" y="269.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Highlights</tspan></text><text x="80.00px" y="286.60px" xml:space="preserve"><tspan xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="80.00px" y="303.40px" xml:space="preserve"/><text x="80.00px" y="320.20px" xml:space="preserve"><tspan xml:space="preserve">• New </tspan><tspan xml:space="preserve" fill="#bcbec4">acme scan subcommand for streaming directory audits.</tspan></text><text x="80.00px" y="337.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• 4× faster cold start on macOS (Apple Silicon).</tspan></text><text x="80.00px" y="353.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• First-class support for </tspan><tspan xml:space="preserve" fill="#bcbec4">.acmerc.toml configuration files.</tspan></text><text x="80.00px" y="370.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">• Bug fixes for the long-standing </tspan><tspan xml:space="preserve" text-decoration="underline">#421</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (https://example.com/issues/421) &quot;phantom file&quot;</tspan></text><text x="80.00px" y="387.40px" xml:space="preserve"><tspan xml:space="preserve">  issue.</tspan></text><text x="80.00px" y="404.20px" xml:space="preserve"/><text x="80.00px" y="421.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">Table of contents</tspan></text><text x="80.00px" y="437.80px" xml:space="preserve"><tspan xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────</tspan></text><text x="80.00px" y="454.60px" xml:space="preserve"/><text x="80.00px" y="471.40px" xml:space="preserve"><tspan xml:space="preserve">1. </tspan><tspan xml:space="preserve" text-decoration="underline">Highlights</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#highlights)</tspan></text><text x="80.00px" y="488.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">2. </tspan><tspan xml:space="preserve" text-decoration="underline">Installation</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#installation)</tspan></text><text x="80.00px" y="505.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">3. </tspan><tspan xml:space="preserve" text-decoration="underline">What&apos;s new</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#whats-new)</tspan></text><text x="80.00px" y="521.80px" xml:space="preserve"><tspan xml:space="preserve">   </tspan><tspan xml:space="preserve" fill="#56a8f5">• </tspan><tspan xml:space="preserve" text-decoration="underline">Streaming scans</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#streaming-scans)</tspan></text><text x="80.00px" y="538.60px" xml:space="preserve"><tspan xml:space="preserve">   </tspan><tspan xml:space="preserve" fill="#56a8f5">• </tspan><tspan xml:space="preserve" text-decoration="underline">Configuration</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#configuration)</tspan></text><text x="80.00px" y="555.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">4. </tspan><tspan xml:space="preserve" text-decoration="underline">Migration</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#migration)</tspan></text><text x="80.00px" y="572.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">5. </tspan><tspan xml:space="preserve" text-decoration="underline">Benchmarks</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#benchmarks)</tspan></text><text x="80.00px" y="589.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">6. </tspan><tspan xml:space="preserve" text-decoration="underline">Known issues</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#known-issues)</tspan></text><text x="80.00px" y="605.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#56a8f5">7. </tspan><tspan xml:space="preserve" text-decoration="underline">Contributors</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#7a7e85"> (#contributors)</tspan></text><text x="80.00px" y="622.60px" xml:space="preserve"><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#56a8f5">release-notes.md </tspan><tspan xml:space="preserve" fill="#7a7e85">│ </tspan><tspan xml:space="preserve" fill="#bcbec4">Rendered </tspan><tspan xml:space="preserve" fill="#7a7e85">│ idea-dark             h:help  Tab:cycle  t:theme  q:quit </tspan></text>
