# Prose linter for the docs (README, manual, docs/). Rules: the Google
# developer documentation style guide, plus project tweaks in the Peek style.
# Run `mise run prose` to see every alert, `mise run lint-prose` for the CI gate.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Peek
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip

[{README.md,manual/src/**/*.md,docs/*.md}]
BasedOnStyles = Vale, Google, Peek

# Replaced by copies in the Peek style with project exceptions.
Google.Headings = NO
Google.Acronyms = NO
Google.WordListCase = NO

# Raised from suggestion so the CI gate checks them.
Google.Semicolons = warning
