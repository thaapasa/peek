# Single source of truth for the dev toolchain — local and CI both resolve
# here, so a new stable's lints can't red CI on an unrelated PR and release
# binaries are built by a known compiler. Bump deliberately, in one commit.
#
# NB: dtolnay/rust-toolchain sets RUSTUP_TOOLCHAIN, which overrides this file.
# CI therefore installs via bare `rustup toolchain install` instead.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
