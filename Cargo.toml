[package]
name = "peek"
description = "Modern terminal file viewer — preview any file, any format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[workspace]
members = ["crates/peek-io", "crates/peek-detect", "crates/peek-theme"]

# Shared package metadata for the bin + every member crate (`field.workspace
# = true` to inherit). One version line for the whole workspace — the release
# pipeline bumps this; see docs/release.md.
[workspace.package]
version = "0.2.12"
edition = "2024"
# Honest floor: the tree already calls stdlib items stabilized in 1.87
# (lines.rs, csv/parse.rs, font, glyph_atlas const ctx). The Info-view
# trait upcasting only needs 1.86, so it sits below this and moves nothing.
rust-version = "1.87"
authors = ["Tuukka Haapasalo <tuukka.haapasalo@gmail.com>"]
license = "MIT"
repository = "https://github.com/thaapasa/peek"
homepage = "https://github.com/thaapasa/peek"

# Single source of truth for dependency versions + features across the
# workspace. Member crates and the root bin reference these with
# `{ workspace = true }`; features are additive, so a crate that needs an
# extra feature adds `features = [...]` alongside the inherit.
[workspace.dependencies]
# Input layer (InputSource, streaming byte/line sources, single-stream codecs)
# and file-type detection, split into their own crates so detection can be
# reviewed/hardened in isolation and can't depend on the reader/viewer layer.
peek-io = { path = "crates/peek-io" }
peek-detect = { path = "crates/peek-detect" }
peek-theme = { path = "crates/peek-theme" }

# CLI framework with derive macros for self-documenting commands
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Terminal handling and colors
crossterm = "0.29"

# Syntax highlighting
syntect = "5"
two-face = "0.5.1"

# File type detection via magic bytes
infer = "0.19"

# Extension-based MIME lookup (covers source-code conventional types)
mime_guess = "2"

# Structured data parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
json5 = "1"
toml = { version = "1.1.2", features = ["preserve_order"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }

# Image handling
image = "0.25"

# SVG rasterization
resvg = "0.47"

# EXIF metadata extraction
kamadak-exif = "0.6.1"

# Error handling
anyhow = "1"
unicode-width = "0.2.2"
gif = "0.14"

# Cheap-clone byte buffers shared between in-memory InputSource variants and
# extract results — `Bytes::slice` is a refcount bump, not a copy.
bytes = "1"

# RAII-cleanup temporary files. Backs `InputSource::TempFile` so the
# archive extractor can spool large entries to disk (random-access reads
# without holding the whole entry in RAM) and the file unlinks
# automatically when the last `Arc<NamedTempFile>` clone drops.
tempfile = "3"

# Archive listing (TOC viewer). Listing-only paths read just the entry
# headers — no payload decompression — so multi-GB archives list cheaply.
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
# Streaming xz decode (liblzma bindings). `static` vendors + builds the
# liblzma C source statically (no system lib at runtime); default
# features off drops the `bindgen` default so the build uses the
# crate's pregenerated bindings instead of requiring libclang — keeps
# the cross-compile release matrix simple.
liblzma = { version = "0.4", default-features = false, features = ["static"] }
zstd = "0.13"
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
# Streaming brotli decode for `.br` / `.tar.br`. Pure Rust, decompress-
# only (already pulled transitively by `wuff` for WOFF2; promoted to a
# direct dep here so the compression layer can call it). Brotli has no
# magic header, so `.br` is extension-only detection — unlike every
# other codec it can't be sniffed from stdin.
brotli-decompressor = "5"
# Runtime: decode-only (default-features = false). The root bin's
# dev-dependencies re-add the `compress` feature for the extract test.
sevenz-rust2 = { version = "0.21", default-features = false }
html2text = { version = "0.17", features = ["css", "css_ext"] }

# Rich Text Format parser. Small lexer/parser; covers the common Word-export
# subset (control words, groups, runs).
rtf-parser = "0.4.2"

# CSV / TSV parsing for the aligned table view. Pure Rust; handles quoting,
# escaping, embedded newlines, configurable delimiter. We use the record
# reader only (no Serde derive) so the dependency surface stays minimal.
csv = "1"

# PDF rendering + text + attachments. Wraps Google's Pdfium (C++) via dlopen
# at process start. The libpdfium.dylib / .so / .dll is shipped alongside
# the peek binary in the release tarball (release.yml grabs it per-target
# from bblanchon/pdfium-binaries) — no system install needed at runtime.
# Dev workflow: `.pdfium/lib/libpdfium.*` is searched as a fallback.
pdfium-render = "0.9"

# Markdown parsing for the rendered view. Pure-Rust event-stream parser
# (no AST allocation per node); same one mdbook uses. GFM tables,
# task-lists, strikethrough, footnotes ship as `Options` flags off the
# base CommonMark grammar — no extra crate features needed.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Audio metadata via symphonia. Pure Rust, no system deps. We use the
# probe + format readers only — no audio decoding — so the info path
# costs are headers + tag tables. Codec features enabled so probe can
# resolve codec params (channels / sample rate / bit depth) for MP3 /
# FLAC / AAC / ALAC / Vorbis / Opus etc; format readers enabled so the
# right container parser is registered for ISOMP4 (m4a/m4b) / CAF /
# AIFF / Ogg / Matroska. Metadata features wire ID3v1/v2 + APE tag
# readers.
symphonia = { version = "0.5", features = ["all-codecs", "all-formats", "opt-simd"] }

# Object-file parsing (ELF / Mach-O / PE / COFF / WASM). One read-only
# API across all formats, so the objfile viewer needs no per-format
# parser. `write` feature dropped — peek never emits object files. The
# `wasm` feature pulls `wasmparser` so `.wasm` modules parse too.
object = { version = "0.36", default-features = false, features = ["read", "std", "wasm"] }

# Java classfile parsing (.class — JVM bytecode container). Pure Rust,
# parse-only: constant pool, fields, methods, attributes, version.
cafebabe = "0.9"
cssparser = "0.37"
cssparser-color = "0.5"

# PEM (certificates, keys) parsing. `pem` splits a file into labelled
# base64 blocks; `x509-parser` decodes the DER body for X.509 certs,
# CSRs, and CRLs. `ssh-key` handles OpenSSH public-key text format
# (`.pub` files). `sha1` / `sha2` produce certificate fingerprints.
# `x509-parser` is also a `peek-detect` dependency: DER-cert detection
# content-verifies the ASN.1 rather than trusting magic bytes.
pem = "3"
x509-parser = "0.18"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa"] }
sha1 = "0.10"
sha2 = "0.10"

# SQLite database access for the .sqlite / .db viewer. `bundled` compiles
# the upstream SQLite C amalgamation into the binary so there's no system
# libsqlite dependency at runtime — matches the bundled-C pattern already
# used by `bzip2` / `zstd` / `liblzma`. Read-only: peek only ever opens
# DBs with `OpenFlags::SQLITE_OPEN_READ_ONLY`.
rusqlite = { version = "0.32", features = ["bundled"] }

# Font (TTF/OTF/TTC) parsing for metadata + per-face listing. Pure Rust,
# no_std-friendly, zero-alloc. Decodes name / head / maxp / cmap / OS/2 /
# post tables — everything the info view needs. Specimen rasterization
# is handled by `fontdue` (promoted to a non-dev dep below).
ttf-parser = "0.25"
# Glyph rasterizer for font specimen render. Already used by the image
# pipeline's glyph atlas; now also promoted to a runtime dep.
fontdue = "0.9"
# WOFF2 → sfnt unwrap. Pure Rust (brotli-decompressor, no C++ FFI); we
# enable only the `brotli` feature since the woff1 path is hand-rolled
# on the in-tree flate2 (see types/font/woff.rs). Handles the brotli
# stream + the glyf/loca table transform that bare decompression can't.
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
calamine = "0.35.0"

# Email (.eml / .mbox) parsing. Pure Rust, no system deps. Parses one
# RFC822/MIME message: headers, decoded text/HTML bodies, nested parts +
# attachments. mbox splitting is hand-rolled (the crate parses single
# messages) so we keep byte offsets for zero-copy `InputSource::subrange`.
mail-parser = "0.11"

# /dev/tty reopen after consuming piped stdin (Unix only)
libc = "0.2"

# CONIN$ reopen after consuming piped stdin (Windows only). Scoped to
# `peek-io::stdin::reopen_stdin_from_tty` — no other module touches
# Win32 console handles.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

# Dev-only
insta = "1"
id3 = "1"

[dependencies]
peek-io = { workspace = true }
peek-detect = { workspace = true }
peek-theme = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
json5 = { workspace = true }
toml = { workspace = true }
quick-xml = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
kamadak-exif = { workspace = true }
anyhow = { workspace = true }
unicode-width = { workspace = true }
gif = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
liblzma = { workspace = true }
zstd = { workspace = true }
lz4_flex = { workspace = true }
brotli-decompressor = { workspace = true }
sevenz-rust2 = { workspace = true }
html2text = { workspace = true }
rtf-parser = { workspace = true }
csv = { workspace = true }
pdfium-render = { workspace = true }
pulldown-cmark = { workspace = true }
symphonia = { workspace = true }
object = { workspace = true }
cafebabe = { workspace = true }
cssparser = { workspace = true }
cssparser-color = { workspace = true }
pem = { workspace = true }
x509-parser = { workspace = true }
ssh-key = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
ttf-parser = { workspace = true }
fontdue = { workspace = true }
wuff = { workspace = true }
calamine = { workspace = true }
mail-parser = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# Snapshot testing for image rendering output
insta = { workspace = true }

# ID3v2 tag writer used by `examples/gen_audio_fixture.rs` to synthesise
# the tagged MP3 test fixture (cover art + lyrics + tag fields). Dev-
# only — runtime probe path goes through symphonia.
id3 = { workspace = true }

# 7z writer (compress feature) for the multi-block extract test only.
# The runtime dep keeps `default-features = false` (decode-only); this
# enables the encoder solely for test builds via feature unification.
sevenz-rust2 = { workspace = true, features = ["compress"] }

# Optimize image processing dependencies even in dev builds —
# these are unusably slow without at least -O2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.zune-inflate]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.color_quant]
opt-level = 2
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
strip = true
