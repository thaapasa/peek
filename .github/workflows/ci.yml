name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v5

      # Tools from mise.toml: Rust from rust-toolchain.toml, nightly rustfmt
      # (postinstall hook), node, prettier, mdbook.
      - uses: jdx/mise-action@v3

      # rav1d (AVIF decode) assembles its x86 SIMD with nasm at build time.
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check Markdown formatting
        if: runner.os == 'Linux'
        run: prettier --check --log-level warn "**/*.md"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --all-targets

      - name: Test
        run: cargo test --workspace --locked --all-targets
